services:
  - type: web
    name: fincontrol
    runtime: docker
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: fincontrol-sqlite
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: BACKUP_TOKEN
        generateValue: true
