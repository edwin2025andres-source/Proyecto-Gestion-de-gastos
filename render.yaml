services:
  - type: web
    name: fincontrol
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: fincontrol-sqlite
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
