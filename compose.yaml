services:
  fincontrol:
    build: .
    image: fincontrol:latest
    container_name: fincontrol
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      BACKUP_TOKEN: ${BACKUP_TOKEN:?Define BACKUP_TOKEN en .env}
    volumes:
      - fincontrol_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fincontrol_data:
